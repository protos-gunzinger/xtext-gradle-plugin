name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17 (build; both matrix daemons run on 17 via javaLauncher)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Run build
        shell: bash
        run: ./gradlew build --stacktrace
      - name: Store HTML test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-html-${{ matrix.os }}
          path: "**/reports/tests/"
      - name: Store XML test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-xml-${{ matrix.os }}
          path: "**/test-results/"
