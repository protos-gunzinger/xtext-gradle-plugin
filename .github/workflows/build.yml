name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      JAVA11_HOME: ${{ runner.arch == 'ARM64' && env.JAVA_HOME_11_ARM64 || env.JAVA_HOME_11_X64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 11 (minimum matrix daemon)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
      - name: Set up JDK 17 (build; last setup wins JAVA_HOME)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Run build
        shell: bash
        run: ./gradlew build -PminTestJavaHome="$JAVA11_HOME" --stacktrace
      - name: Store HTML test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-html-${{ matrix.os }}
          path: "**/reports/tests/"
      - name: Store XML test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-xml-${{ matrix.os }}
          path: "**/test-results/"
